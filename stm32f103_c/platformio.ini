[env:stm32f103c8]
; 使用 STM32F103C8 的通用芯片配置：64 KB Flash、20 KB SRAM。
platform = ststm32@20.0.0
; 该版 Arm GCC 提供适用于 Ubuntu ARM64 虚拟机的交叉编译器。
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
board = genericSTM32F103C8
; CMSIS 提供启动代码、向量表和寄存器定义，应用入口在 src/main.c。
framework = cmsis
; 通过 ST-LINK 的 SWD 接口烧录，无需指定串口。
upload_protocol = stlink
